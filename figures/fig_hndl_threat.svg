<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" style="background:#FFFFFF; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- MAIN CONTAINER FRAME                                                      -->
  <!-- ========================================================================= -->
  <rect x="12" y="12" width="976" height="566" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- ========================================================================= -->
  <!-- PANEL (a): The HNDL Attack Vector & Temporal Vulnerability Window         -->
  <!-- ========================================================================= -->
  <g id="panel-a">
    <rect x="26" y="26" width="462" height="538" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="26" y="26" width="462" height="34" rx="6" fill="#991B1B"/>
    <rect x="26" y="48" width="462" height="12" fill="#991B1B"/>
    <text x="40" y="48" font-size="12" font-weight="bold" fill="#FFFFFF">(a) The "Harvest Now, Decrypt Later" (HNDL) Threat Vector</text>

    <!-- Subtitle / Context note -->
    <text x="40" y="78" font-size="9" fill="#64748B" font-style="italic">Vulnerability trajectory of classical ciphers (RSA / ECC) across the quantum timeline</text>

    <!-- Phase 1: Present Day Ingestion & Eavesdropping -->
    <g transform="translate(40, 92)">
      <rect x="0" y="0" width="434" height="106" rx="5" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#DC2626"/>
      <text x="52" y="23" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">PHASE 1: T₀</text>
      <text x="100" y="23" font-size="10.5" font-weight="bold" fill="#991B1B">Present Classical Era: Passive Eavesdropping</text>

      <!-- Step items inside Phase 1 -->
      <circle cx="20" cy="46" r="3.5" fill="#DC2626"/>
      <text x="30" y="49" font-size="9" fill="#1E293B"><tspan font-weight="bold">Enterprise Cloud Traffic:</tspan> Client uploads data secured via RSA-3072 / ECDH-256.</text>
      
      <circle cx="20" cy="68" r="3.5" fill="#DC2626"/>
      <text x="30" y="71" font-size="9" fill="#1E293B"><tspan font-weight="bold">Adversarial Interception:</tspan> WAN sniffers capture and hoard ciphertexts.</text>
      
      <!-- Adversary Storage Lake Pill -->
      <rect x="30" y="80" width="390" height="18" rx="3" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="0.8"/>
      <text x="225" y="93" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#B91C1C">Adversary Storage Lake: Accumulating Petabytes of Encrypted Payloads</text>
    </g>

    <!-- Downward Timeline Transition Arrow 1 -->
    <g transform="translate(257, 200)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
      <rect x="-85" y="3" width="170" height="14" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="0" y="13.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#64748B">Data Retention Period (10–50 Years)</text>
    </g>

    <!-- Phase 2: Mosca's Dilemma Card -->
    <g transform="translate(40, 224)">
      <rect x="0" y="0" width="434" height="116" rx="5" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.2" filter="url(#card-shadow)"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#D97706"/>
      <text x="52" y="23" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">PHASE 2: ΔT</text>
      <text x="100" y="23" font-size="10.5" font-weight="bold" fill="#92400E">The Cryptographic Shelf-Life Dilemma</text>

      <text x="14" y="46" font-size="9" fill="#1E293B">Long-retention enterprise records must remain confidential for decades:</text>
      
      <!-- Bullet chips -->
      <rect x="14" y="54" width="130" height="20" rx="3" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
      <text x="79" y="68" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350F">HIPAA: 50-Yr Health Data</text>

      <rect x="152" y="54" width="130" height="20" rx="3" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
      <text x="217" y="68" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350F">Basel III: Financial Ledgers</text>

      <rect x="290" y="54" width="130" height="20" rx="3" fill="#FEF3C7" stroke="#FDE68A" stroke-width="0.8"/>
      <text x="355" y="68" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350F">Classified IP Archives</text>

      <!-- Mosca's Theorem Box -->
      <rect x="14" y="80" width="406" height="26" rx="3" fill="#FEF9C3" stroke="#FACC15" stroke-width="0.8"/>
      <text x="217" y="93" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#854D0E">Mosca's Theorem: If (Security Shelf-Life + Migration Time) &gt; Time to CRQC,</text>
      <text x="217" y="103" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#B45309">then data is ALREADY COMPROMISED today under classical ciphers!</text>
    </g>

    <!-- Downward Timeline Transition Arrow 2 -->
    <g transform="translate(257, 342)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#arrow-red)"/>
      <rect x="-85" y="3" width="170" height="14" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="0" y="13.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#DC2626">CRQC Hardware Milestone Reached</text>
    </g>

    <!-- Phase 3: Post-Quantum Decryption & Exfiltration -->
    <g transform="translate(40, 366)">
      <rect x="0" y="0" width="434" height="114" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4" filter="url(#card-shadow)"/>
      <rect x="12" y="10" width="80" height="18" rx="3" fill="#991B1B"/>
      <text x="52" y="23" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">PHASE 3: T_Q</text>
      <text x="100" y="23" font-size="10.5" font-weight="bold" fill="#991B1B">Quantum Era: Retrospective Batch Decryption</text>

      <circle cx="20" cy="46" r="3.5" fill="#991B1B"/>
      <text x="30" y="49" font-size="9" fill="#1E293B"><tspan font-weight="bold">Shor's Algorithm Deployed:</tspan> Solves discrete log &amp; IFP in O(n³) polynomial time.</text>

      <circle cx="20" cy="68" r="3.5" fill="#991B1B"/>
      <text x="30" y="71" font-size="9" fill="#1E293B"><tspan font-weight="bold">Asymmetric Key Collapse:</tspan> RSA &amp; ECC master keys instantly reconstructed.</text>

      <!-- Catastrophic Breach Alert -->
      <rect x="14" y="80" width="406" height="24" rx="3" fill="#B91C1C"/>
      <text x="217" y="96" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#FFFFFF">Catastrophic Historical Exfiltration: Decades of Archives Laid Bare</text>
    </g>

    <!-- Panel (a) Bottom Summary Pill -->
    <rect x="40" y="492" width="434" height="60" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="50" y="509" font-size="9" font-weight="bold" fill="#334155">Summary: Classical Cloud Inadequacy</text>
    <text x="50" y="525" font-size="8.2" fill="#475569">• Encrypting today with classical ECC or RSA offers zero forward quantum secrecy.</text>
    <text x="50" y="540" font-size="8.2" fill="#475569">• Storage systems must deploy quantum-resilient defense BEFORE the CRQC horizon.</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL (b): Proposed Multi-Tier Proactive Defense Architecture              -->
  <!-- ========================================================================= -->
  <g id="panel-b">
    <rect x="502" y="26" width="472" height="538" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="502" y="26" width="472" height="34" rx="6" fill="#1E3A8A"/>
    <rect x="502" y="48" width="472" height="12" fill="#1E3A8A"/>
    <text x="516" y="48" font-size="12" font-weight="bold" fill="#FFFFFF">(b) Proposed Multi-Tier Proactive Cloud Defense Lifecycle</text>

    <!-- Subtitle / Context note -->
    <text x="516" y="78" font-size="9" fill="#64748B" font-style="italic">Layered defense-in-depth: Nullifying quantum decapsulation, DoS, and single-point leaks</text>

    <!-- Defense Tier 1: Early-Drop HMAC -->
    <g transform="translate(516, 92)">
      <rect x="0" y="0" width="444" height="66" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" filter="url(#card-shadow)"/>
      <rect x="12" y="8" width="60" height="17" rx="3" fill="#16A34A"/>
      <text x="42" y="20" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">TIER 1</text>
      <text x="80" y="20" font-size="10" font-weight="bold" fill="#166534">0.089 ms Early-Drop Outer HMAC Filter</text>
      
      <rect x="354" y="8" width="80" height="17" rx="3" fill="#DCFCE7"/>
      <text x="394" y="20" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#15803D">Anti-DoS Defense</text>

      <text x="14" y="38" font-size="8.6" fill="#14532D">Verifies outer HMAC envelope before executing expensive cryptographic decapsulation.</text>
      <text x="14" y="52" font-size="8.4" fill="#15803D"><tspan font-weight="bold">Result:</tspan> Drops forged payloads in 0.089 ms; prevents CPU exhaustion attacks.</text>
    </g>

    <!-- Arrow Down -->
    <line x1="738" y1="160" x2="738" y2="170" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Defense Tier 2: Adaptive Decision Engine (AEDE) -->
    <g transform="translate(516, 172)">
      <rect x="0" y="0" width="444" height="66" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" filter="url(#card-shadow)"/>
      <rect x="12" y="8" width="60" height="17" rx="3" fill="#2563EB"/>
      <text x="42" y="20" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">TIER 2</text>
      <text x="80" y="20" font-size="10" font-weight="bold" fill="#1E40AF">Adaptive Encryption Decision Engine (AEDE)</text>

      <rect x="344" y="8" width="90" height="17" rx="3" fill="#DBEAFE"/>
      <text x="389" y="20" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#1E40AF">Telemetry-Driven</text>

      <text x="14" y="38" font-size="8.6" fill="#1E3A8A">Evaluates classification sensitivity σ and real-time WAN packet loss telemetry.</text>
      <text x="14" y="52" font-size="8.4" fill="#2563EB"><tspan font-weight="bold">Selection:</tspan> Low → ECC-256 | Medium → Kyber-512 | High → Dual-Key Hybrid.</text>
    </g>

    <!-- Arrow Down -->
    <line x1="738" y1="240" x2="738" y2="250" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <!-- Defense Tier 3: Dual-Key Hybrid KEM -->
    <g transform="translate(516, 252)">
      <rect x="0" y="0" width="444" height="74" rx="5" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1" filter="url(#card-shadow)"/>
      <rect x="12" y="8" width="60" height="17" rx="3" fill="#7C3AED"/>
      <text x="42" y="20" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">TIER 3</text>
      <text x="80" y="20" font-size="10" font-weight="bold" fill="#5B21B6">Dual-Key Hybrid KEM (SECP256R1 + Kyber-512)</text>

      <rect x="344" y="8" width="90" height="17" rx="3" fill="#EDE9FE"/>
      <text x="389" y="20" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#6D28D9">IND-CCA2 Provable</text>

      <text x="14" y="38" font-size="8.6" fill="#4C1D95">Concatenates classical ECDH (S_ecc) &amp; lattice Kyber-512 (S_kyber) via HKDF-SHA256.</text>
      <text x="14" y="52" font-size="8.4" fill="#6D28D9"><tspan font-weight="bold">Quantum Resilience:</tspan> If CRQC breaks ECC, Kyber's M-LWE (2¹⁴³ Core-SVP) holds.</text>
      <text x="14" y="65" font-size="8.2" fill="#5B21B6">If Kyber suffers unforeseen algebraic flaw, classical SECP256R1 maintains security.</text>
    </g>

    <!-- Arrow Down -->
    <line x1="738" y1="328" x2="738" y2="338" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <!-- Defense Tier 4: Zero-Trust Shamir (2,3) Secret Splitting -->
    <g transform="translate(516, 340)">
      <rect x="0" y="0" width="444" height="66" rx="5" fill="#FEFCE8" stroke="#FDE047" stroke-width="1" filter="url(#card-shadow)"/>
      <rect x="12" y="8" width="60" height="17" rx="3" fill="#CA8A04"/>
      <text x="42" y="20" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">TIER 4</text>
      <text x="80" y="20" font-size="10" font-weight="bold" fill="#854D0E">Zero-Trust Shamir (2,3) Key Splitting over GF(257)</text>

      <rect x="344" y="8" width="90" height="17" rx="3" fill="#FEF9C3"/>
      <text x="389" y="20" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#854D0E">Zero Single-Point Leak</text>

      <text x="14" y="38" font-size="8.6" fill="#713F12">Partitions 256-bit AES master key K_enc into 3 shares: Share 1 (Header), Share 2 (DB).</text>
      <text x="14" y="52" font-size="8.4" fill="#A16207"><tspan font-weight="bold">Isolation:</tspan> Compromise of central database or object storage yields zero key knowledge.</text>
    </g>

    <!-- Arrow Down -->
    <line x1="738" y1="408" x2="738" y2="418" stroke="#CA8A04" stroke-width="1.5" marker-end="url(#arrow-green)"/>

    <!-- Defense Tier 5: Immutable Hash-Chain Ledger & Forensics -->
    <g transform="translate(516, 420)">
      <rect x="0" y="0" width="444" height="62" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" filter="url(#card-shadow)"/>
      <rect x="12" y="8" width="60" height="17" rx="3" fill="#475569"/>
      <text x="42" y="20" text-anchor="middle" font-size="8" font-weight="bold" fill="#FFFFFF">TIER 5</text>
      <text x="80" y="20" font-size="10" font-weight="bold" fill="#334155">Cryptographic Hash-Chain &amp; Anomaly Detection</text>

      <rect x="344" y="8" width="90" height="17" rx="3" fill="#E2E8F0"/>
      <text x="389" y="20" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#334155">Forensic Audit Trail</text>

      <text x="14" y="38" font-size="8.6" fill="#334155">Append-only SHA-256 hash chaining guarantees tamper-evident provenance.</text>
      <text x="14" y="51" font-size="8.4" fill="#475569">Sliding-window Bayesian classifier detects brute-force decapsulation attempts.</text>
    </g>

    <!-- Final Green Outcome Card -->
    <g transform="translate(516, 492)">
      <rect x="0" y="0" width="444" height="60" rx="4" fill="#ECFDF5" stroke="#34D399" stroke-width="1.2"/>
      <text x="14" y="19" font-size="9" font-weight="bold" fill="#065F46">Provable Forward Secrecy &amp; Operational Guarantee:</text>
      <text x="14" y="35" font-size="8.2" fill="#047857">• Intercepted ciphertexts remain cryptographically impenetrable indefinitely.</text>
      <text x="14" y="50" font-size="8.2" fill="#047857">• Even under retrospective quantum attacks, data at rest and data in transit remain secure.</text>
    </g>
  </g>
</svg>
