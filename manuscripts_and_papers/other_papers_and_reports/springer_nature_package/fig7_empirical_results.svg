<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640">
  <defs>
    <!-- Soft, muted, calm academic colors (no harsh neons) -->
    <!-- Drop Shadow Filter -->
    <filter id="soft-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#334E68" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="940" height="640" fill="#F8FAFC" stroke="none"/>
  
  <!-- Outer Master Container -->
  <rect x="12" y="12" width="916" height="616" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#soft-shadow)"/>

  <!-- ========================================================================= -->
  <!-- PANEL A: Cryptographic Pipeline Latency Breakdown (Top-Left)              -->
  <!-- ========================================================================= -->
  <g id="panel-a">
    <rect x="25" y="25" width="435" height="280" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
    <rect x="25" y="25" width="435" height="30" rx="5" fill="#2B4C6F"/>
    <rect x="25" y="45" width="435" height="10" fill="#2B4C6F"/>
    <text x="38" y="45" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">(a) Cryptographic Pipeline Latency Breakdown (1 MB Payload)</text>

    <!-- Plot Canvas Area -->
    <rect x="75" y="72" width="370" height="188" fill="#FBFBFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Y-Axis Grid Lines -->
    <line x1="75" y1="260" x2="445" y2="260" stroke="#94A3B8" stroke-width="1"/>
    <line x1="75" y1="215" x2="445" y2="215" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="75" y1="170" x2="445" y2="170" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="75" y1="125" x2="445" y2="125" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="75" y1="80" x2="445" y2="80" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>

    <!-- Y-Axis Labels -->
    <text x="42" y="264" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">0.0 ms</text>
    <text x="42" y="219" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">2.0 ms</text>
    <text x="42" y="174" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">4.0 ms</text>
    <text x="42" y="129" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">6.0 ms</text>
    <text x="42" y="84" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">8.0 ms</text>

    <!-- Bars with Calm, Non-Irritating Colors -->
    <!-- Bar 1: RSA-3072 (7.88 ms) -> height = 7.88 * 22.5 = 177.3 px | Color: Muted Terracotta #B85C50 -->
    <rect x="102" y="82.7" width="55" height="177.3" rx="3" fill="#B85C50" stroke="#8E3B30" stroke-width="1"/>
    <text x="129" y="75" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#8E3B30" text-anchor="middle">7.88 ms</text>
    <text x="129" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155" text-anchor="middle">RSA-3072</text>
    <text x="129" y="290" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#B85C50" text-anchor="middle">Vulnerable</text>

    <!-- Bar 2: ECC-256 (1.88 ms) -> height = 1.88 * 22.5 = 42.3 px | Color: Muted Warm Ochre #C98A4B -->
    <rect x="187" y="217.7" width="55" height="42.3" rx="3" fill="#C98A4B" stroke="#9E642E" stroke-width="1"/>
    <text x="214" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#9E642E" text-anchor="middle">1.88 ms</text>
    <text x="214" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155" text-anchor="middle">ECC-256</text>
    <text x="214" y="290" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#A86F36" text-anchor="middle">Classical Only</text>

    <!-- Bar 3: Kyber-512 (0.09 ms) -> clamped to 6px | Color: Calm Sage Green #4A7C59 -->
    <rect x="272" y="254" width="55" height="6" rx="2" fill="#4A7C59" stroke="#335A3F" stroke-width="1"/>
    <text x="299" y="246" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#335A3F" text-anchor="middle">0.09 ms</text>
    <text x="299" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155" text-anchor="middle">Kyber-512</text>
    <text x="299" y="290" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#4A7C59" text-anchor="middle">Post-Quantum</text>

    <!-- Bar 4: Proposed Hybrid (1.28 ms) -> height = 1.28 * 22.5 = 28.8 px | Color: Calm Steel Navy #3A6B88 -->
    <rect x="357" y="231.2" width="55" height="28.8" rx="3" fill="#3A6B88" stroke="#254A60" stroke-width="1"/>
    <text x="384" y="223" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#254A60" text-anchor="middle">1.28 ms</text>
    <text x="384" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#2B4C6F" text-anchor="middle">Proposed</text>
    <text x="384" y="290" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#3A6B88" text-anchor="middle">Dual-Safe Hybrid</text>

    <!-- Speedup Callout Badge (Muted slate styling) -->
    <rect x="270" y="88" width="165" height="36" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="352" y="103" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#1E293B" text-anchor="middle">6.15x Faster than RSA</text>
    <text x="352" y="117" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Dual Classical + Post-Quantum Safety</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: Payload Scaling & Dynamic Threshold (Top-Right)                  -->
  <!-- ========================================================================= -->
  <g id="panel-b">
    <rect x="480" y="25" width="435" height="280" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
    <rect x="480" y="25" width="435" height="30" rx="5" fill="#3B6978"/>
    <rect x="480" y="45" width="435" height="10" fill="#3B6978"/>
    <text x="493" y="45" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">(b) Payload Scaling &amp; AEDE Dynamic Offloading (τ = 5 MB)</text>

    <!-- Plot Canvas -->
    <rect x="535" y="72" width="365" height="188" fill="#FBFBFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Shaded Zone 1 for Sub-5MB Hybrid Mode (Soft Muted Sage Tint) -->
    <rect x="535" y="72" width="180" height="188" fill="#F0F5F2" opacity="0.9"/>
    <text x="625" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#335A3F" text-anchor="middle">ZONE 1: Dual Hybrid (≤ 5MB)</text>

    <!-- Shaded Zone 2 for Kyber Large Fallback (Soft Warm Sand Tint) -->
    <rect x="715" y="72" width="185" height="188" fill="#F9F6F0" opacity="0.9"/>
    <text x="807" y="90" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#7D5A2E" text-anchor="middle">ZONE 2: Kyber Fallback (&gt; 5MB)</text>

    <!-- Threshold Divider Line -->
    <line x1="715" y1="72" x2="715" y2="260" stroke="#3B6978" stroke-width="1.8" stroke-dasharray="4,3"/>
    <rect x="675" y="238" width="80" height="18" rx="3" fill="#3B6978"/>
    <text x="715" y="251" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">τ = 5 MB</text>

    <!-- Y-Axis Grid & Labels -->
    <line x1="535" y1="260" x2="900" y2="260" stroke="#94A3B8" stroke-width="1"/>
    <line x1="535" y1="210" x2="900" y2="210" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="535" y1="160" x2="900" y2="160" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="535" y1="110" x2="900" y2="110" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>

    <text x="495" y="264" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">0 ms</text>
    <text x="495" y="214" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">5 ms</text>
    <text x="495" y="164" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">10 ms</text>
    <text x="495" y="114" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">15 ms</text>

    <!-- X-Axis Labels -->
    <text x="540" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">100KB</text>
    <text x="600" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">1MB</text>
    <text x="715" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#3B6978" text-anchor="middle">5MB</text>
    <text x="880" y="277" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B" text-anchor="middle">10MB</text>

    <!-- Unoptimized Curve (Muted Terracotta Dashed Line) -->
    <path d="M 540,248 Q 650,220 715,160 T 880,85" fill="none" stroke="#B85C50" stroke-width="1.8" stroke-dasharray="4,4"/>
    <text x="835" y="98" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#8E3B30">Without AEDE</text>

    <!-- Proposed Adaptive Curve (Calm Steel Navy Solid Line) -->
    <path d="M 540,256 L 600,247 L 715,225 L 880,210" fill="none" stroke="#3A6B88" stroke-width="2.5"/>
    <circle cx="540" cy="256" r="4" fill="#3A6B88" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="600" cy="247" r="4" fill="#3A6B88" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="715" cy="225" r="4.5" fill="#C98A4B" stroke="#8A521E" stroke-width="1.5"/>
    <circle cx="880" cy="210" r="4" fill="#4A7C59" stroke="#FFFFFF" stroke-width="1.2"/>

    <!-- Callout Box (Soft linen tone) -->
    <rect x="735" y="138" width="155" height="40" rx="3" fill="#F4F2EB" stroke="#C98A4B" stroke-width="1"/>
    <text x="812" y="153" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#7D5A2E" text-anchor="middle">93.0% Savings</text>
    <text x="812" y="168" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#5A4020" text-anchor="middle">CPU Compute Offload at 10MB</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL C: DoS Authentication Mitigation Workflow (Bottom-Left)             -->
  <!-- ========================================================================= -->
  <g id="panel-c">
    <rect x="25" y="325" width="435" height="280" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
    <rect x="25" y="325" width="435" height="30" rx="5" fill="#475569"/>
    <rect x="25" y="345" width="435" height="10" fill="#475569"/>
    <text x="38" y="45" transform="translate(0, 300)" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">(c) DoS Authentication Rejection: Early-Drop vs Conventional</text>

    <!-- Left Box: Conventional Attack Pathway (Soft Muted Rose) -->
    <rect x="40" y="375" width="190" height="142" rx="4" fill="#FDF7F7" stroke="#E2C4C4" stroke-width="1.2"/>
    <rect x="40" y="375" width="190" height="22" rx="4" fill="#B85C50"/>
    <rect x="40" y="389" width="190" height="8" fill="#B85C50"/>
    <text x="135" y="390" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Conventional Pipeline</text>
    
    <text x="50" y="418" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6B3333">1. Read Fragment 1 (Header)</text>
    <text x="50" y="435" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6B3333">2. Fetch Fragment 2 (SQL DB)</text>
    <text x="50" y="452" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6B3333">3. Reconstruct Secret (GF257)</text>
    <text x="50" y="469" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6B3333">4. Kyber Decapsulation</text>
    <text x="50" y="486" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#6B3333">5. Inner AES-GCM Tag Verify</text>
    
    <rect x="50" y="495" width="170" height="16" rx="2" fill="#F4E6E6"/>
    <text x="135" y="506" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#8E3B30" text-anchor="middle">Latency: 1.280 ms / req</text>

    <!-- Right Box: Proposed Early Drop (Soft Muted Sage) -->
    <rect x="255" y="375" width="190" height="142" rx="4" fill="#F4F8F5" stroke="#BFD9C7" stroke-width="1.2"/>
    <rect x="255" y="375" width="190" height="22" rx="4" fill="#4A7C59"/>
    <rect x="255" y="389" width="190" height="8" fill="#4A7C59"/>
    <text x="350" y="390" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Proposed Early-Drop</text>
    
    <text x="265" y="418" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#22422C">1. Edge Ingestion Gate</text>
    <text x="265" y="435" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#22422C">2. Outer HMAC Fast Check</text>
    <text x="265" y="451" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#335A3F">   (Bypasses DB, Secret</text>
    <text x="265" y="464" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#335A3F">    Sharing &amp; Kyber)</text>
    <text x="265" y="484" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#22422C">3. Hash-Chain Log &amp; Drop</text>
    
    <rect x="265" y="495" width="170" height="16" rx="2" fill="#E2EEE6"/>
    <text x="350" y="506" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#2E533A" text-anchor="middle">Latency: 0.012 ms / req</text>

    <!-- Speedup Banner (Muted Slate Navy) -->
    <rect x="40" y="532" width="405" height="55" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <circle cx="68" cy="559" r="14" fill="#334E68"/>
    <text x="68" y="564" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="96" y="552" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">106x Threat Rejection Speedup</text>
    <text x="96" y="570" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#475569">Eliminates 99.06% CPU cycles under high-volume flood attacks</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL D: Enterprise Workload Optimization (Bottom-Right)                  -->
  <!-- ========================================================================= -->
  <g id="panel-d">
    <rect x="480" y="325" width="435" height="280" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
    <rect x="480" y="325" width="435" height="30" rx="5" fill="#334E68"/>
    <rect x="480" y="345" width="435" height="10" fill="#334E68"/>
    <text x="493" y="45" transform="translate(0, 300)" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">(d) Enterprise Workload Latency Optimization Across Profiles</text>

    <!-- Plot Canvas -->
    <rect x="535" y="372" width="365" height="178" fill="#FBFBFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Y-Axis Grid & Labels -->
    <line x1="535" y1="535" x2="900" y2="535" stroke="#94A3B8" stroke-width="1"/>
    <line x1="535" y1="495" x2="900" y2="495" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="535" y1="455" x2="900" y2="455" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="535" y1="415" x2="900" y2="415" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="535" y1="375" x2="900" y2="375" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,3"/>

    <text x="495" y="539" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">0 ms</text>
    <text x="495" y="499" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">2 ms</text>
    <text x="495" y="459" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">4 ms</text>
    <text x="495" y="419" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">6 ms</text>
    <text x="495" y="379" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#64748B">8 ms</text>

    <!-- Profile A Group (General: 10% High) -->
    <!-- Baseline: 1.41 ms -> 28.2 px | Soft Slate Grey #9FB3C8 -->
    <rect x="560" y="506.8" width="30" height="28.2" rx="2" fill="#9FB3C8" stroke="#7A92AB" stroke-width="1"/>
    <!-- Proposed: 1.31 ms -> 26.2 px | Calm Steel Blue #3A6B88 -->
    <rect x="595" y="508.8" width="30" height="26.2" rx="2" fill="#3A6B88" stroke="#254A60" stroke-width="1"/>
    <text x="610" y="498" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#254A60" text-anchor="middle">-6.88%</text>
    <text x="592" y="552" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155" text-anchor="middle">Profile A</text>
    <text x="592" y="565" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">General</text>

    <!-- Profile B Group (FinTech / HIPAA: 40% High) -->
    <!-- Baseline: 3.20 ms -> 64 px | Soft Slate Grey #9FB3C8 -->
    <rect x="670" y="471" width="30" height="64" rx="2" fill="#9FB3C8" stroke="#7A92AB" stroke-width="1"/>
    <!-- Proposed: 1.46 ms -> 29.2 px | Calm Sage Green #4A7C59 -->
    <rect x="705" y="505.8" width="30" height="29.2" rx="2" fill="#4A7C59" stroke="#335A3F" stroke-width="1"/>
    <text x="720" y="498" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#335A3F" text-anchor="middle">-54.38%</text>
    <text x="702" y="552" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155" text-anchor="middle">Profile B</text>
    <text x="702" y="565" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">FinTech / Med</text>

    <!-- Profile C Group (Defense / Critical: 70% High) -->
    <!-- Baseline: 4.97 ms -> 99.4 px | Soft Slate Grey #9FB3C8 -->
    <rect x="785" y="435.6" width="30" height="99.4" rx="2" fill="#9FB3C8" stroke="#7A92AB" stroke-width="1"/>
    <!-- Proposed: 1.60 ms -> 32 px | Calm Dusty Plum #6B5B95 -->
    <rect x="820" y="503" width="30" height="32" rx="2" fill="#6B5B95" stroke="#4C3D73" stroke-width="1"/>
    <text x="835" y="493" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#4C3D73" text-anchor="middle">-67.81%</text>
    <text x="817" y="552" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155" text-anchor="middle">Profile C</text>
    <text x="817" y="565" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Defense / High</text>

    <!-- Legend -->
    <rect x="545" y="578" width="12" height="12" rx="2" fill="#9FB3C8"/>
    <text x="562" y="587" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#475569">Static Baseline</text>
    <rect x="645" y="578" width="12" height="12" rx="2" fill="#3A6B88"/>
    <text x="662" y="587" font-family="Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#2B4C6F">Adaptive Hybrid Engine (Proposed)</text>
  </g>
</svg>