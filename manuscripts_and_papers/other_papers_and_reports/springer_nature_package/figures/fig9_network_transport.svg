<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <defs>
    <filter id="soft-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="620" fill="#F8FAFC"/>
  
  <!-- Outer Border Container -->
  <rect x="14" y="14" width="932" height="592" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" filter="url(#soft-shadow)"/>

  <!-- ========================================================================= -->
  <!-- TOP HALF: (a) TCP MTU vs MSS Framing & Segmentation Threshold              -->
  <!-- ========================================================================= -->
  <g id="subpanel-a">
    <rect x="28" y="26" width="904" height="268" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="28" y="26" width="904" height="32" rx="6" fill="#1E3A5F"/>
    <rect x="28" y="46" width="904" height="12" fill="#1E3A5F"/>
    <text x="42" y="47" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">(a) Transport-Layer Packet Framing, MTU Fragmentation Boundaries, and Cryptographic Public Key Expansion</text>

    <!-- Ethernet Frame Reference Line -->
    <rect x="42" y="70" width="876" height="38" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="54" y="94" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#334155">Standard Ethernet Frame (MTU = 1500 Bytes)</text>
    <rect x="520" y="76" width="115" height="26" rx="3" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="528" y="93" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#475569">IP Header (20 B)</text>
    <rect x="640" y="76" width="125" height="26" rx="3" fill="#E2E8F0" stroke="#94A3B8"/>
    <text x="648" y="93" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#475569">TCP Header (20 B)</text>
    <rect x="770" y="76" width="138" height="26" rx="3" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="778" y="93" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#92400E">TCP MSS = 1460 Bytes</text>

    <!-- Scheme 1: Classical ECC-256 -->
    <g transform="translate(42, 118)">
      <rect x="0" y="0" width="170" height="42" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
      <text x="12" y="20" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400E">Classical ECC-256</text>
      <text x="12" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#78350F">PK: 64 B | CT: 0 B (ECDH)</text>

      <line x1="172" y1="21" x2="208" y2="21" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

      <rect x="210" y="0" width="140" height="42" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <text x="218" y="20" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#065F46">Single TCP Segment</text>
      <text x="218" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#047857">N_seg = 1 (64 B ≪ 1460 B)</text>

      <rect x="365" y="0" width="511" height="42" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="375" y="19" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#15803D">✓ Zero IP/TCP Fragmentation</text>
      <text x="375" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#64748B">Handshake latency tracks base RTT directly. Packet loss probability = p (strictly linear).</text>
    </g>

    <!-- Scheme 2: Standalone Kyber-512 -->
    <g transform="translate(42, 168)">
      <rect x="0" y="0" width="170" height="42" rx="4" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2"/>
      <text x="12" y="20" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Kyber-512 Standalone</text>
      <text x="12" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#14532D">PK: 800 B | CT: 768 B</text>

      <line x1="172" y1="21" x2="208" y2="21" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

      <rect x="210" y="0" width="140" height="42" rx="4" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
      <text x="218" y="20" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#991B1B">Multi-Segment Split</text>
      <text x="218" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#B91C1C">N_seg = 2 Segments (1568 B)</text>

      <rect x="365" y="0" width="511" height="42" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
      <text x="375" y="19" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#B91C1C">⚠ Super-Linear Vulnerability under Loss</text>
      <text x="375" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7F1D1D">P_loss_hs = 1 - (1 - p)^2. Dropping either segment triggers TCP RTO backoff (120 ms → 495 ms at 10% loss).</text>
    </g>

    <!-- Scheme 3: Proposed Hybrid with AEDE Optimization -->
    <g transform="translate(42, 218)">
      <rect x="0" y="0" width="170" height="42" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
      <text x="12" y="20" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E40AF">Proposed Hybrid + AEDE</text>
      <text x="12" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#1E3A8A">Combined PK: 864 B | CT: 768 B</text>

      <line x1="172" y1="21" x2="208" y2="21" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

      <rect x="210" y="0" width="140" height="42" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="218" y="20" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1D4ED8">Adaptive QUIC / FEC</text>
      <text x="218" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#2563EB">0-RTT Streams + RS Codes</text>

      <rect x="365" y="0" width="511" height="42" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="375" y="19" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#15803D">✓ QUIC Head-of-Line Elimination + AEDE Dynamic Large-File Offloading</text>
      <text x="375" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#166534">Payload-aware decision engine restricts multi-segment overhead to high-sensitivity files ≤ 5 MB.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM HALF: (b) TCP Retransmission Cascade Timeline & Latency Surge       -->
  <!-- ========================================================================= -->
  <g id="subpanel-b">
    <rect x="28" y="306" width="904" height="288" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="28" y="306" width="904" height="32" rx="6" fill="#2E7D5B"/>
    <rect x="28" y="326" width="904" height="12" fill="#2E7D5B"/>
    <text x="42" y="327" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">(b) Network Impairment Timeline: Single Packet Loss Inducing Exponential RTO Backoff &amp; Multi-Region Impact</text>

    <!-- Timeline Columns: Client, Network, Storage Server -->
    <!-- Lane 1: Client -->
    <line x1="120" y1="360" x2="120" y2="540" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="75" y="348" width="90" height="22" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="96" y="363" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">Client API</text>

    <!-- Lane 2: Edge Gateway -->
    <line x1="280" y1="360" x2="280" y2="540" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="235" y="348" width="90" height="22" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="246" y="363" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">Lossy WAN</text>

    <!-- Lane 3: Object Storage -->
    <line x1="440" y1="360" x2="440" y2="540" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="390" y="348" width="100" height="22" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
    <text x="402" y="363" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">Cloud Server</text>

    <!-- Packet Flow 1: Segment 1 Delivered -->
    <line x1="120" y1="380" x2="440" y2="405" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
    <rect x="190" y="380" width="170" height="18" rx="2" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="198" y="393" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#166534">TCP Seg 1 (MSS = 1460 B) [ACK'd]</text>

    <!-- Packet Flow 2: Segment 2 DROPPED -->
    <line x1="120" y1="415" x2="280" y2="432" stroke="#DC2626" stroke-width="1.8"/>
    <circle cx="280" cy="432" r="7" fill="#DC2626"/>
    <text x="276" y="436" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">✕</text>
    <rect x="150" y="420" width="120" height="18" rx="2" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="156" y="433" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#991B1B">TCP Seg 2 (108 B) [LOST]</text>

    <!-- Head of Line Stall & RTO Timer -->
    <rect x="125" y="448" width="310" height="24" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="135" y="464" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#B91C1C">Head-of-Line Blocking: RTO_0 Timer Expires (200 ms timeout delay)</text>

    <!-- Retransmit -->
    <line x1="120" y1="485" x2="440" y2="510" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
    <rect x="175" y="485" width="200" height="18" rx="2" fill="#FEF2F2" stroke="#EF4444"/>
    <text x="182" y="498" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#B91C1C">TCP Retransmission Seg 2 (RTO Backoff)</text>

    <!-- Completed Handshake -->
    <line x1="440" y1="520" x2="120" y2="540" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <rect x="210" y="522" width="140" height="18" rx="2" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="218" y="535" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#1E40AF">Connection Ready (512 ms)</text>

    <!-- Right Side: Latency Surge Comparison Bar Chart -->
    <rect x="520" y="348" width="398" height="232" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="532" y="368" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B">Empirical Handshake Latency Surge vs Packet Loss Rate</text>
    <text x="532" y="382" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#64748B">Evaluated over tc-netem synthetic impairment profiles (1 MB payload transfers)</text>

    <!-- Sub-bars for 4 impairment profiles -->
    <!-- Ideal LAN (0%) -->
    <g transform="translate(532, 396)">
      <text x="0" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Ideal LAN (0% loss):</text>
      <rect x="160" y="3" width="22" height="15" fill="#2E7D5B" rx="2"/>
      <text x="190" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#2E7D5B">1.28 ms (Baseline)</text>
    </g>

    <!-- Moderate Cloud (1%) -->
    <g transform="translate(532, 426)">
      <text x="0" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Mod. Cloud (1% loss):</text>
      <rect x="160" y="3" width="58" height="15" fill="#3B82F6" rx="2"/>
      <text x="226" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#1D4ED8">25.8 ms (+7.5% vs ECC)</text>
    </g>

    <!-- Degraded WAN (5%) -->
    <g transform="translate(532, 456)">
      <text x="0" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Degraded WAN (5% loss):</text>
      <rect x="160" y="3" width="135" height="15" fill="#F59E0B" rx="2"/>
      <text x="302" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#B45309">165.2 ms (+229%)</text>
    </g>

    <!-- Severe Lossy Edge (10%) -->
    <g transform="translate(532, 486)">
      <text x="0" y="14" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#334155">Lossy Edge (10% loss):</text>
      <rect x="160" y="3" width="210" height="15" fill="#EF4444" rx="2"/>
      <text x="200" y="515" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#B91C1C">512.4 ms (+310.8% Latency Surge)</text>
    </g>

    <!-- Solution note -->
    <rect x="532" y="525" width="374" height="46" rx="3" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="540" y="542" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#166534">Proposed Mitigation Guarantee:</text>
    <text x="540" y="557" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#15803D">QUIC datagram frames + Reed-Solomon (RS) FEC recover dropped segments without RTO delays.</text>
  </g>
</svg>
