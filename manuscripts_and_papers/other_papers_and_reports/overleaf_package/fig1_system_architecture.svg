<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" width="920" height="720">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="soft-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#334E68" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="920" height="720" fill="#FFFFFF" stroke="none"/>
  
  <!-- Outer Border Frame (Draw.io style) -->
  <rect x="15" y="15" width="890" height="690" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2"/>

  <!-- ========================================================================= -->
  <!-- LAYER 1: CLIENT LAYER                                                     -->
  <!-- ========================================================================= -->
  <rect x="25" y="25" width="870" height="75" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="35" y="42" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" font-weight="bold" fill="#475569">Client Layer</text>
  
  <!-- Web Client / REST API Interface Box -->
  <rect x="330" y="40" width="260" height="42" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="460" y="66" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Web Client / REST API Interface</text>

  <!-- Connector Arrow: Client -> Middleware -->
  <line x1="460" y1="82" x2="460" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================================================= -->
  <!-- LAYER 2: MIDDLEWARE LAYER                                                 -->
  <!-- ========================================================================= -->
  <rect x="25" y="110" width="870" height="75" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="35" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" font-weight="bold" fill="#475569">Middleware Layer</text>

  <!-- Flask REST API Gateway Box -->
  <rect x="330" y="125" width="260" height="42" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="460" y="151" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Flask REST API Gateway</text>

  <!-- Connector Arrow: Middleware -> Core Processing -->
  <line x1="460" y1="167" x2="460" y2="202" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================================================= -->
  <!-- LAYER 3: CORE PROCESSING LAYER                                            -->
  <!-- ========================================================================= -->
  <rect x="25" y="195" width="870" height="175" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="35" y="212" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" font-weight="bold" fill="#475569">Core Processing Layer</text>

  <!-- Adaptive Decision Engine Diamond (Draw.io style) -->
  <polygon points="460,205 565,225 460,245 355,225" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="460" y="229" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Adaptive Decision Engine</text>

  <!-- Branches from Decision Engine to 3 Primitives -->
  <line x1="375" y1="230" x2="200" y2="258" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="245" x2="460" y2="258" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="545" y1="230" x2="720" y2="258" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Three Primitives Boxes -->
  <!-- 1. ECC-256 -->
  <rect x="100" y="260" width="200" height="38" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="200" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">ECC-256 (SECP256R1)</text>

  <!-- 2. Kyber-512 -->
  <rect x="360" y="260" width="200" height="38" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="460" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Kyber-512 (NIST ML-KEM)</text>

  <!-- 3. Hybrid -->
  <rect x="620" y="260" width="200" height="38" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="720" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Hybrid (ECC + Kyber-512)</text>

  <!-- Converging Lines to HKDF Key Derivation -->
  <line x1="200" y1="298" x2="400" y2="318" stroke="#334155" stroke-width="1.2"/>
  <line x1="460" y1="298" x2="460" y2="318" stroke="#334155" stroke-width="1.2"/>
  <line x1="720" y1="298" x2="520" y2="318" stroke="#334155" stroke-width="1.2"/>

  <!-- HKDF-SHA256 Key Derivation Box -->
  <rect x="330" y="318" width="260" height="36" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="460" y="341" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B" text-anchor="middle">HKDF-SHA256 Key Derivation</text>

  <!-- Connectors from HKDF to Security Layer -->
  <line x1="390" y1="354" x2="260" y2="390" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="354" x2="660" y2="390" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================================================= -->
  <!-- LAYER 4: SECURITY LAYER                                                   -->
  <!-- ========================================================================= -->
  <rect x="25" y="380" width="870" height="135" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="35" y="397" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" font-weight="bold" fill="#475569">Security Layer</text>

  <!-- Left Branch: Payload Cipher & Early Drop Outer HMAC -->
  <rect x="110" y="405" width="270" height="36" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="245" y="428" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">AES-256-GCM Payload Cipher</text>

  <line x1="245" y1="441" x2="245" y2="463" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="465" width="270" height="36" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="245" y="488" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Early-Drop Outer HMAC-SHA256</text>

  <!-- Right Branch: Shamir Secret Sharing & Fragments -->
  <rect x="520" y="405" width="290" height="36" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="665" y="428" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1E293B" text-anchor="middle">Shamir (2,3) Secret Sharing GF(257)</text>

  <line x1="590" y1="441" x2="550" y2="463" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="740" y1="441" x2="780" y2="463" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Frag 1 and Frag 2 Boxes -->
  <rect x="470" y="465" width="160" height="36" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="550" y="488" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Frag 1 (Object Header)</text>

  <rect x="700" y="465" width="160" height="36" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="780" y="488" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Frag 2 (SQLite DB)</text>

  <!-- ========================================================================= -->
  <!-- LAYER 5: STORAGE LAYER                                                    -->
  <!-- ========================================================================= -->
  <rect x="25" y="525" width="870" height="85" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="35" y="542" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" font-weight="bold" fill="#475569">Storage Layer</text>

  <!-- Connectors into Storage Layer -->
  <line x1="245" y1="501" x2="260" y2="543" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="501" x2="330" y2="543" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="780" y1="501" x2="680" y2="543" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Storage Boxes (Cylinder style corners) -->
  <rect x="160" y="545" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.3" filter="url(#soft-shadow)"/>
  <text x="270" y="573" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Object Storage (MinIO / S3)</text>

  <rect x="560" y="545" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#334155" stroke-width="1.3" filter="url(#soft-shadow)"/>
  <text x="670" y="573" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">SQLite Metadata DB</text>

  <!-- ========================================================================= -->
  <!-- LAYER 6: MONITORING LAYER                                                 -->
  <!-- ========================================================================= -->
  <rect x="25" y="620" width="870" height="75" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="35" y="637" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" font-weight="bold" fill="#475569">Monitoring Layer</text>

  <!-- Hash-Chain Audit Logger -->
  <rect x="160" y="637" width="250" height="42" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="285" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Hash-Chain Audit Logger</text>

  <!-- Connector Arrow: Audit Logger -> Real-Time Anomaly Engine -->
  <line x1="410" y1="658" x2="518" y2="658" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Real-Time Anomaly Engine -->
  <rect x="530" y="637" width="250" height="42" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.2" filter="url(#soft-shadow)"/>
  <text x="655" y="663" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#1E293B" text-anchor="middle">Real-Time Anomaly Engine</text>
</svg>